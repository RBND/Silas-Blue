services:
  silas-blue:
    build: .
    container_name: silas-blue
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      # Expose only to localhost if using Caddy or internal LAN;
      # Change to "8080:8080" if accessing directly over LAN without Caddy
      - "127.0.0.1:8080:8080"
    environment:
      - PYTHONUNBUFFERED=1

  # Optional automated HTTPS reverse-proxy for public VPS deployments
  caddy:
    image: caddy:2-alpine
    container_name: silas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - silas-blue

volumes:
  caddy_data:
  caddy_config:
