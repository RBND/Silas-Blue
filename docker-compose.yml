services:
  silas-blue:
    build: .
    container_name: silas-blue
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    ports:
      # Expose to loopback by default; change to "8080:8080" for direct LAN access
      - "127.0.0.1:8080:8080"
    environment:
      - SILAS_HEADLESS=true
      - SILAS_WEB_HOST=0.0.0.0
      - SILAS_WEB_PORT=8080
      - SILAS_DB_PATH=/app/data/silas.db
      - SILAS_BACKUPS_DIR=/app/backups

  # Optional automated HTTPS reverse-proxy for public VPS deployments
  caddy:
    image: caddy:2-alpine
    container_name: silas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - silas-blue

volumes:
  caddy_data:
  caddy_config:
