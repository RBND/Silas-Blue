[package]
edition = "2018"
rust-version = "1.63"
name = "tokio-tungstenite"
version = "0.21.0"
authors = [
    "Daniel Abramov <dabramov@snapview.de>",
    "Alexey Galakhov <agalakhov@snapview.de>",
]
description = "Tokio binding for Tungstenite, the Lightweight stream-based WebSocket implementation"
license = "MIT"

[dependencies.futures-util]
version = "0.3.28"
features = [
    "sink",
    "std",
]
default-features = false

[dependencies.log]
version = "0.4.17"

[dependencies.native-tls-crate]
version = "0.2.11"
optional = true
package = "native-tls"

[dependencies.rustls]
version = "0.23.0"
optional = true
default-features = false
features = ["std", "tls12", "ring"]

[dependencies.rustls-native-certs]
version = "0.7.0"
optional = true

[dependencies.rustls-pki-types]
version = "1.0"
optional = true

[dependencies.tokio]
version = "1.0.0"
features = ["io-util"]
default-features = false

[dependencies.tokio-native-tls]
version = "0.3.1"
optional = true

[dependencies.tokio-rustls]
version = "0.26.0"
optional = true
default-features = false
features = ["tls12", "ring"]

[dependencies.tungstenite]
version = "0.21.0"
default-features = false

[dependencies.webpki-roots]
version = "1.0"
optional = true

[features]
__rustls-tls = [
    "rustls",
    "rustls-pki-types",
    "tokio-rustls",
    "stream",
    "handshake",
]
connect = [
    "stream",
    "tokio/net",
    "handshake",
]
default = [
    "connect",
    "handshake",
]
handshake = ["tungstenite/handshake"]
native-tls = [
    "native-tls-crate",
    "tokio-native-tls",
    "stream",
    "tungstenite/native-tls",
    "handshake",
]
native-tls-vendored = [
    "native-tls",
    "native-tls-crate/vendored",
    "tungstenite/native-tls-vendored",
]
rustls-tls-native-roots = [
    "__rustls-tls",
    "rustls-native-certs",
]
rustls-tls-webpki-roots = [
    "__rustls-tls",
    "webpki-roots",
]
stream = []
