<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cyber Midnight -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#211b3e"/>
      <stop offset="55%" stop-color="#141325"/>
      <stop offset="100%" stop-color="#0a0914"/>
    </radialGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4df8ff"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00a2ff"/>
    </linearGradient>

    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7be5"/>
      <stop offset="50%" stop-color="#ff3399"/>
      <stop offset="100%" stop-color="#e60073"/>
    </linearGradient>

    <!-- Subtle Cyber Glow Filter -->
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle with Neon Border (High contrast on dark & light browser chrome) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg-grad)" stroke="#00e5ff" stroke-width="6" stroke-opacity="0.38"/>

  <!-- Robot Mascot Group -->
  <g filter="url(#cyber-glow)">
    <!-- Antenna Connectors / Ears Brackets -->
    <rect x="106" y="246" width="38" height="24" rx="6" fill="#141325" stroke="url(#neon-cyan)" stroke-width="11"/>
    <rect x="368" y="246" width="38" height="24" rx="6" fill="#141325" stroke="url(#neon-cyan)" stroke-width="11"/>

    <!-- Left Antenna Rod (slight outward angle) -->
    <line x1="126" y1="210" x2="120" y2="76" stroke="url(#neon-pink)" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Antenna Ring Orb -->
    <circle cx="120" cy="74" r="28" fill="#141325" stroke="url(#neon-pink)" stroke-width="13"/>
    <circle cx="120" cy="74" r="13" fill="#ff7be5" opacity="0.95"/>

    <!-- Right Antenna Rod (slight outward angle) -->
    <line x1="386" y1="210" x2="392" y2="76" stroke="url(#neon-pink)" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Antenna Ring Orb -->
    <circle cx="392" cy="74" r="28" fill="#141325" stroke="url(#neon-pink)" stroke-width="13"/>
    <circle cx="392" cy="74" r="13" fill="#ff7be5" opacity="0.95"/>

    <!-- Left Earphone Capsule -->
    <rect x="80" y="214" width="48" height="116" rx="24" fill="#141325" stroke="url(#neon-cyan)" stroke-width="13"/>

    <!-- Right Earphone Capsule -->
    <rect x="384" y="214" width="48" height="116" rx="24" fill="#141325" stroke="url(#neon-cyan)" stroke-width="13"/>

    <!-- Head Outline Dome & Jaw -->
    <path d="M 132 232 
             C 132 130, 380 130, 380 232 
             L 380 346 
             C 380 380, 350 442, 330 442 
             L 182 442 
             C 162 442, 132 380, 132 346 Z" 
          fill="#141325" stroke="url(#neon-cyan)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Visor -->
    <rect x="156" y="238" width="200" height="96" rx="26" fill="#0b0a14" stroke="url(#neon-cyan)" stroke-width="13"/>

    <!-- Glowing Circular Eyes -->
    <circle cx="210" cy="286" r="25" fill="url(#neon-cyan)"/>
    <circle cx="302" cy="286" r="25" fill="url(#neon-cyan)"/>

    <!-- Outlined Synthwave Mouth Slit -->
    <polygon points="198,418 214,418 230,398 296,398 296,380 216,380" 
             fill="#0b0a14" stroke="url(#neon-cyan)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>