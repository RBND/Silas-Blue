<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Silas Blue Web Manager</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="stylesheet" href="/static/app.css?v=3.5.8">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #12121c;
        }
        .login-card {
            background-color: #1a1a27;
            border: 1px solid rgba(255, 94, 203, 0.25);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: #5865f2;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .discord-btn:hover {
            background-color: #4752c4;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .otp-form input {
            width: 100%;
            box-sizing: border-box;
            background-color: #232136;
            color: #ffffff;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .otp-btn {
            width: 100%;
            background-color: #282a36;
            color: #ffffff;
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .otp-btn:hover {
            background-color: #00f0ff;
            color: #12121c;
        }
        .info-note {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/favicon.svg" alt="Silas Blue" style="width: 58px; height: 58px; border-radius: 14px; margin-bottom: 12px; box-shadow: 0 0 24px rgba(0, 240, 255, 0.35);">
        <div class="login-brand">SILAS BLUE</div>
        <div class="login-subtitle">Remote Management v3.5.8</div>

        <!-- Discord OAuth2 Login -->
        <a href="/auth/discord/login" class="discord-btn">
            <svg width="20" height="15" viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M60.1 4.9A58.7 58.7 0 0045.6.4a.2.2 0 00-.2.1 41 41 0 00-1.8 3.7 54.3 54.3 0 00-16.2 0A40.6 40.6 0 0025.6.5a.2.2 0 00-.2-.1 58.5 58.5 0 00-14.5 4.5.2.2 0 00-.1.1C1.8 18.2-.8 31.1.2 43.8a.3.3 0 00.1.2 59 59 0 0017.8 9 .2.2 0 00.3-.1 42.4 42.4 0 003.6-5.9.2.2 0 00-.1-.3 38.8 38.8 0 01-5.6-2.7.2.2 0 010-.4c.4-.3.8-.6 1.1-.9a.2.2 0 01.2 0 42.1 42.1 0 0036.1 0 .2.2 0 01.2 0c.4.3.8.6 1.2 1a.2.2 0 010 .3 38.6 38.6 0 01-5.6 2.7.2.2 0 00-.1.3 47.7 47.7 0 003.6 5.9.2.2 0 00.3.1 58.8 58.8 0 0017.8-9 .3.3 0 00.1-.2c1.2-14.7-2-27.4-10.7-38.8a.2.2 0 00-.1-.1zM23.7 36.2c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z" fill="#FFFFFF"/>
            </svg>
            Log in with Discord
        </a>

        <div class="divider">OR LAN / LOCAL ACCESS</div>

        <!-- One-Time Magic Link Token Entry -->
        <form class="otp-form" action="/auth/otp" method="GET">
            <input type="text" name="token" placeholder="Paste One-Time Token from console" required autocomplete="off">
            <button type="submit" class="otp-btn">Access Console</button>
        </form>

        <div class="info-note">
            🔒 <b>Security Notice:</b> Only Discord accounts configured as the Bot Owner or authorized administrators can log in. For local setups, check your server console for the one-time magic link.
        </div>
    </div>
</body>
</html>
